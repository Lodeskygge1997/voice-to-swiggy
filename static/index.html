<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swiggy Voice Order</title>
    <!-- We load standard Inter font for that modern app feel -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Swiggy inspired color palette */
            --primary: #fc8019;
            --primary-dark: #e06c10;
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-light: #2c2c2c;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --success: #60b246;
            --error: #fa4a5b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            /* Disable pull-to-refresh on mobile */
            overscroll-behavior-y: none;
        }

        /* Top App Bar */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(96, 178, 70, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(96, 178, 70, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(96, 178, 70, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(96, 178, 70, 0); }
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Status and Feedback */
        .status-container {
            text-align: center;
            margin-bottom: 3rem;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        #statusText {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .wave-animation {
            display: none;
            gap: 4px;
            height: 30px;
            align-items: center;
            margin-top: 10px;
        }
        
        .wave-animation.active {
            display: flex;
        }

        .wave-bar {
            width: 4px;
            height: 100%;
            background-color: var(--primary);
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { height: 20%; }
            50% { height: 100%; }
        }

        /* Microphone Button */
        .mic-wrapper {
            position: relative;
            margin-bottom: 2rem;
        }

        #micBtn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--surface);
            border: 2px solid rgba(255,255,255,0.1);
            color: var(--primary);
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Prevent text selection when holding */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #micBtn:active {
            transform: scale(0.92);
        }

        /* The glowing ring when recording */
        #micBtn.recording {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 15px rgba(252, 128, 25, 0.2),
                        0 0 0 30px rgba(252, 128, 25, 0.1);
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 0 10px rgba(252, 128, 25, 0.2), 0 0 0 20px rgba(252, 128, 25, 0.1); }
            to { box-shadow: 0 0 0 20px rgba(252, 128, 25, 0.3), 0 0 0 40px rgba(252, 128, 25, 0.1); }
        }
        
        /* Chat Input Section */
        .chat-section {
            width: 100%;
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .chat-input-container {
            display: flex;
            background: var(--surface);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            padding: 5px;
        }
        
        #chatInput {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
        }
        
        #chatInput::placeholder {
            color: var(--text-muted);
        }
        
        #sendBtn {
            background: var(--primary);
            border: none;
            border-radius: 15px;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        #sendBtn:hover {
            background: var(--primary-dark);
        }

        /* Result Area */
        #resultArea {
            width: 100%;
            margin-top: 2rem;
            background: var(--surface);
            border-radius: 16px;
            padding: 1.5rem;
            display: none;
            border: 1px solid rgba(255,255,255,0.05);
            animation: slideUp 0.4s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        #transcriptionText {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text);
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        #aiResponse {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--success);
            font-weight: 500;
        }

        /* Helper text */
        .menu-hint {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
            background: var(--surface-light);
            padding: 1rem;
            border-radius: 12px;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1><div class="pulse-dot"></div> Swiggy Voice Agent</h1>
    </header>

    <main>
        <div class="status-container">
            <div id="statusText">Hold to Speak</div>
            <div class="wave-animation" id="waveAnim">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>

        <div class="mic-wrapper">
            <button id="micBtn">🎙️</button>
        </div>
        
        <div class="chat-section">
            <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem;">OR</div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" placeholder="Type your order here...">
                <button id="sendBtn">➤</button>
            </div>
        </div>

        <div id="resultArea">
            <div class="result-label">You said:</div>
            <div id="transcriptionText"></div>
            <div class="result-label">Agent Response:</div>
            <div id="aiResponse"></div>
        </div>

        <div class="menu-hint">
            Available mock menu: Paneer Tikka, Garlic Naan, Butter Chicken, Dal Makhani, Jeera Rice, Biryani, Coke, Thumbs Up.
        </div>
    </main>

    <!-- Auth Bottom Sheet -->
    <div class="overlay" id="authOverlay"></div>
    <div class="bottom-sheet" id="authSheet">
        <div class="sheet-header">
            <h3>Login to Swiggy</h3>
            <button class="close-sheet" id="closeSheetBtn">&times;</button>
        </div>
        
        <!-- Phone Step -->
        <div id="phoneStep">
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem;">Please enter your mobile number to continue.</p>
            <input type="tel" id="phoneInput" class="auth-input" placeholder="+91 99999 99999" autocomplete="tel">
            <button class="auth-btn" id="sendOtpBtn">Send OTP</button>
        </div>

        <!-- OTP Step -->
        <div id="otpStep" style="display: none;">
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem;">Enter the 6-digit OTP sent to your number.</p>
            <input type="text" id="otpInput" class="auth-input otp-input" placeholder="000000" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6">
            <button class="auth-btn" id="verifyOtpBtn">Verify & Login</button>
        </div>
    </div>

    <style>
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 99;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            padding: 2rem;
            z-index: 100;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .bottom-sheet.open {
            bottom: 0;
        }
        
        .overlay.open {
            display: block;
            opacity: 1;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .sheet-header h3 {
            font-size: 1.4rem;
            color: white;
        }
        
        .close-sheet {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
        }

        .auth-input {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: white;
            font-size: 1.2rem;
            outline: none;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 2px;
        }
        
        .auth-input:focus { border-color: var(--primary); }
        
        .otp-input { letter-spacing: 8px; font-size: 1.5rem; font-weight: bold; }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .auth-btn:hover { background: var(--primary-dark); }
    </style>

    <script>
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');
        const waveAnim = document.getElementById('waveAnim');
        const resultArea = document.getElementById('resultArea');
        const transcriptionText = document.getElementById('transcriptionText');
        const aiResponse = document.getElementById('aiResponse');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // Extract UID from URL params if present (from Telegram Web App link)
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('uid') || 'anonymous_web_user';

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };

                mediaRecorder.onstop = sendAudioToServer;
            } catch (err) {
                console.error("Microphone access denied:", err);
                statusText.innerText = "Mic access denied. Please allow it in browser settings.";
                statusText.style.color = 'var(--error)';
            }
        }

        // Initialize on load
        initAudio();

        // Mouse/Touch events for push-to-talk
        const startRecording = (e) => {
            e.preventDefault(); // prevent touch delay
            if (!mediaRecorder || isRecording) return;
            
            audioChunks = [];
            mediaRecorder.start();
            isRecording = true;
            
            micBtn.classList.add('recording');
            statusText.innerText = "Listening...";
            statusText.style.color = 'white';
            waveAnim.classList.add('active');
            
            // Hide previous results
            resultArea.style.display = 'none';
        };

        const stopRecording = (e) => {
            e.preventDefault();
            if (!mediaRecorder || !isRecording) return;
            
            mediaRecorder.stop();
            isRecording = false;
            
            micBtn.classList.remove('recording');
            statusText.innerText = "Processing...";
            statusText.style.color = 'var(--primary)';
            waveAnim.classList.remove('active');
        };

        micBtn.addEventListener('mousedown', startRecording);
        micBtn.addEventListener('mouseup', stopRecording);
        micBtn.addEventListener('mouseleave', stopRecording); // If cursor leaves while holding
        
        micBtn.addEventListener('touchstart', startRecording, {passive: false});
        micBtn.addEventListener('touchend', stopRecording, {passive: false});

        async function sendAudioToServer() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append('audio', audioBlob);
            formData.append('user_id', userId);

            try {
                const response = await fetch('/api/order/web', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                statusText.innerText = "Hold to Speak";
                statusText.style.color = 'var(--text-muted)';
                
                transcriptionText.innerText = data.transcription || "Couldn't hear anything.";
                aiResponse.innerText = data.message || "Agent did not respond.";
                resultArea.style.display = 'block';

            } catch (error) {
                console.error("Error sending audio:", error);
                statusText.innerText = "Error processing audio.";
                statusText.style.color = 'var(--error)';
                setTimeout(() => {
                    statusText.innerText = "Hold to Speak";
                    statusText.style.color = 'var(--text-muted)';
                }, 3000);
            }
        }
        
        async function sendTextToServer() {
            const text = chatInput.value.trim();
            if (!text) return;
            
            chatInput.value = '';
            statusText.innerText = "Sending...";
            statusText.style.color = 'var(--primary)';
            resultArea.style.display = 'none';
            
            try {
                const response = await fetch('/api/order/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, user_id: userId })
                });

                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                statusText.innerText = "Hold to Speak";
                statusText.style.color = 'var(--text-muted)';
                
                transcriptionText.innerText = data.transcription;
                aiResponse.innerText = data.message || "Agent did not respond.";
                resultArea.style.display = 'block';

            } catch (error) {
                console.error("Error sending text:", error);
                statusText.innerText = "Error sending message.";
                statusText.style.color = 'var(--error)';
                setTimeout(() => {
                    statusText.innerText = "Hold to Speak";
                    statusText.style.color = 'var(--text-muted)';
                }, 3000);
            }
        }
        
        sendBtn.addEventListener('click', sendTextToServer);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextToServer();
        });
        
        // Auth Bottom Sheet Logic
        const authOverlay = document.getElementById('authOverlay');
        const authSheet = document.getElementById('authSheet');
        const closeSheetBtn = document.getElementById('closeSheetBtn');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        
        function openAuthSheet() {
            authOverlay.classList.add('open');
            authSheet.classList.add('open');
        }
        
        function closeAuthSheet() {
            authOverlay.classList.remove('open');
            authSheet.classList.remove('open');
            // reset steps
            setTimeout(() => {
                document.getElementById('phoneStep').style.display = 'block';
                document.getElementById('otpStep').style.display = 'none';
            }, 400);
        }
        
        closeSheetBtn.addEventListener('click', closeAuthSheet);
        authOverlay.addEventListener('click', closeAuthSheet);
        
        sendOtpBtn.addEventListener('click', () => {
            const phone = document.getElementById('phoneInput').value;
            if(phone.length > 9) {
                // Mock API call for OTP
                sendOtpBtn.innerText = "Sending...";
                setTimeout(() => {
                    document.getElementById('phoneStep').style.display = 'none';
                    document.getElementById('otpStep').style.display = 'block';
                    document.getElementById('otpInput').focus();
                }, 1000);
            }
        });
        
        verifyOtpBtn.addEventListener('click', () => {
            const otp = document.getElementById('otpInput').value;
            if(otp.length >= 4) {
                verifyOtpBtn.innerText = "Verifying...";
                setTimeout(() => {
                    verifyOtpBtn.innerText = "Verify & Login";
                    closeAuthSheet();
                    statusText.innerText = "Logged in successfully!";
                    setTimeout(() => statusText.innerText = "Hold to Speak", 2000);
                }, 1000);
            }
        });
        
        // Mock authentication check - Open on page load if no UID
        if(userId === 'anonymous_web_user') {
            setTimeout(openAuthSheet, 1000);
        }
    </script>
</body>
</html>
